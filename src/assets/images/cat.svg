<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat body -->
  <ellipse cx="100" cy="120" rx="50" ry="40" fill="#FF9A56" stroke="#333" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="70" r="35" fill="#FF9A56" stroke="#333" stroke-width="2"/>

  <!-- Cat ears -->
  <polygon points="75,50 65,25 85,40" fill="#FF9A56" stroke="#333" stroke-width="2"/>
  <polygon points="125,50 135,25 115,40" fill="#FF9A56" stroke="#333" stroke-width="2"/>

  <!-- Inner ears -->
  <polygon points="77,48 70,32 82,42" fill="#FFD4A3"/>
  <polygon points="123,48 130,32 118,42" fill="#FFD4A3"/>

  <!-- Cat eyes -->
  <ellipse cx="85" cy="65" rx="8" ry="12" fill="white"/>
  <ellipse cx="115" cy="65" rx="8" ry="12" fill="white"/>
  <ellipse cx="85" cy="68" rx="5" ry="8" fill="#333"/>
  <ellipse cx="115" cy="68" rx="5" ry="8" fill="#333"/>
  <ellipse cx="83" cy="65" rx="2" ry="3" fill="white"/>
  <ellipse cx="113" cy="65" rx="2" ry="3" fill="white"/>

  <!-- Cat nose -->
  <path d="M 95 80 Q 100 85 105 80" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="78" r="3" fill="#FF6B9D"/>

  <!-- Cat mouth -->
  <path d="M 100 82 Q 90 88 85 85" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 82 Q 110 88 115 85" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>

  <!-- Cat whiskers -->
  <line x1="50" y1="75" x2="75" y2="75" stroke="#333" stroke-width="1.5"/>
  <line x1="50" y1="80" x2="75" y2="78" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="75" x2="125" y2="75" stroke="#333" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="125" y2="78" stroke="#333" stroke-width="1.5"/>

  <!-- Cat legs -->
  <rect x="70" y="145" width="15" height="35" rx="7" fill="#FF9A56" stroke="#333" stroke-width="2"/>
  <rect x="115" y="145" width="15" height="35" rx="7" fill="#FF9A56" stroke="#333" stroke-width="2"/>

  <!-- Cat paws -->
  <ellipse cx="77.5" cy="178" rx="10" ry="6" fill="#FFD4A3"/>
  <ellipse cx="122.5" cy="178" rx="10" ry="6" fill="#FFD4A3"/>

  <!-- Cat tail -->
  <path d="M 145 130 Q 170 120 175 95 Q 177 80 170 70" fill="none" stroke="#FF9A56" stroke-width="20" stroke-linecap="round"/>
  <path d="M 145 130 Q 170 120 175 95 Q 177 80 170 70" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
